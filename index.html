<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARAS</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; opacity: 0; transition: opacity 0.4s ease; }
        iframe.loaded { opacity: 1; }
        #loader {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #fff; z-index: 10;
            gap: 16px;
            transition: opacity 0.4s ease;
        }
        #loader.hide { opacity: 0; pointer-events: none; }
        .logo {
            width: 64px; height: 64px;
            border-radius: 50%;
            animation: pulse 1.2s ease-in-out infinite;
            object-fit: cover;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.75; }
        }
        #loader p { font-family: sans-serif; color: #999; font-size: 14px; margin: 0; }
    </style>
</head>
<body>
    <div id="loader">
        <img
            class="logo"
            src="https://lh3.googleusercontent.com/d/1m-DwSbsYNO1choM7qPm1XzsESIISRA0a=s200"
            alt="LARAS Logo"
        >
        <p>Memuat LARAS...</p>
    </div>
    <iframe
        id="laras"
        src="https://script.google.com/macros/s/AKfycbxruxLx-C3foXvpiqfPhblyk-93TqHfL7m0ZAG63ZCvgA5m0T8f5zNf7GeBJTGzUfJ7/exec"
    ></iframe>
    <script>
        const iframe = document.getElementById('laras');
        const loader = document.getElementById('loader');
        iframe.addEventListener('load', () => {
            iframe.classList.add('loaded');
            loader.classList.add('hide');
            setTimeout(() => loader.remove(), 500);
        });
    </script>
</body>
</html>
