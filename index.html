<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARAS</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; opacity: 0; transition: opacity 0.4s ease; }
        iframe.loaded { opacity: 1; }

        #loader {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #fff; z-index: 10;
            gap: 16px;
            transition: opacity 0.4s ease;
        }
        #loader.hide { opacity: 0; pointer-events: none; }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #eee;
            border-top-color: #e91e8c; /* sesuaikan warna LARAS */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loader p { font-family: sans-serif; color: #999; font-size: 14px; margin: 0; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Memuat LARAS...</p>
    </div>

    <iframe
        id="laras"
        src="https://script.google.com/macros/s/AKfycbxruxLx-C3foXvpiqfPhblyk-93TqHfL7m0ZAG63ZCvgA5m0T8f5zNf7GeBJTGzUfJ7/exec"
    ></iframe>

    <script>
        const iframe = document.getElementById('laras');
        const loader = document.getElementById('loader');

        iframe.addEventListener('load', () => {
            iframe.classList.add('loaded');
            loader.classList.add('hide');
            setTimeout(() => loader.remove(), 500);
        });
    </script>
</body>
</html>
